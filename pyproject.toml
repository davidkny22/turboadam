[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turboadam"
version = "0.2.0"
description = "AdamW with packed 6.50-bit persistent optimizer state and a fused Triton update path."
readme = "README.md"
keywords = ["optimizer", "adam", "adamw", "pytorch", "memory-efficient", "quantization", "deep-learning", "training"]
authors = [{ name = "David Kogan", email = "davidkny22@gmail.com" }]
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2.0",
]

[project.optional-dependencies]
triton = [
    "triton>=2.2.0; sys_platform == 'linux'",
    "triton-windows>=3.6.0.post26; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "matplotlib>=3.8.0",
    "datasets>=2.18.0",
    "transformers>=4.40.0",
]

[project.urls]
Homepage = "https://github.com/davidkny22/turboadam"
Repository = "https://github.com/davidkny22/turboadam"
Issues = "https://github.com/davidkny22/turboadam/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
